---

## Design Rationale

This reconstruction completely reorganizes the original figure into a clearer four-stage scientific workflow with:

1. Strong left-to-right causal flow.
2. Reduced visual clutter and fewer redundant insets.
3. Explicit mapping between:

   * Geometry preprocessing
   * GGGF construction
   * HashGrid + neural field learning
   * Advancing-front mesh generation
4. Publication-oriented hierarchy:

   * Large stage blocks
   * Unified color semantics
   * Minimal but informative mathematical annotations
   * Balanced whitespace and alignment
5. Emphasis on the core novelty:

   * Neural-field-driven boundary layer generation
   * Residual learning formulation
   * PDE smoothing
   * Robust quality validation

## Recommended Usage

* Save the SVG block as:
  `pipeline_reconstructed.svg`
* Import directly into:

  * Adobe Illustrator
  * Inkscape
  * Figma
  * PowerPoint
  * LaTeX (`\includesvg` or `inkscape` workflow)
* Export to PDF for journal submission.

## Suggested Caption

"Overview of the proposed neural-field-driven framework for automated 3D anisotropic boundary-layer mesh generation. The pipeline consists of four tightly coupled stages: (1) curvature-aware volumetric sampling, (2) construction of the global geometric guidance field (GGGF), (3) multiresolution boundary-constrained neural field learning with physics-guided losses, and (4) robust advancing-front extrusion with topology-aware quality validation."
